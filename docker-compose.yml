name: entorno-ia

services:
  workspace:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DISABLE_AUTOUPDATER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - home:/home/node
      - workspace:/workspace
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8080:8080"
    init: true

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["llamacpp"]
    restart: unless-stopped
    environment:
      LLAMA_ARG_HF_REPO: ${LLAMACPP_HF_REPO:-unsloth/Qwen3.5-9B-GGUF:Q4_K_M}
      LLAMA_ARG_ALIAS: modelo-local
      LLAMA_ARG_CTX_SIZE: ${LLAMACPP_CTX:-32768}
      LLAMA_ARG_CPU_MOE: ${LLAMACPP_CPU_MOE:-false}
      LLAMA_ARG_MMPROJ_AUTO: "false"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_CACHE: /models
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  home:
  workspace:
  models:
